# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# Hosted cubic review settings. cubic bills per reviewed line, so this skips
# only machine-written files: changelogs, test snapshots, generated output and
# lockfiles. All code, tests, fixtures, docs and READMEs stay reviewed.
version: 1

reviews:
  ignore:
    files:
      - '**/CHANGELOG.md'
      # Test snapshots
      - '**/*.snap'
      # Generated output (the generators and their inputs stay reviewed)
      - '**/dist/**'
      - '**/generated/**'
      - '**/*.generated.*'
      # Lockfiles. The loops' local review reports dependency advisories a
      # lockfile change adds (osv-scanner) before the PR opens and on every fix push.
      - 'pnpm-lock.yaml'
      - '**/pnpm-lock.yaml'
      - 'package-lock.json'
      - '**/package-lock.json'
      - 'yarn.lock'
      - '**/yarn.lock'
      - 'bun.lock'
      - '**/bun.lock'
      - 'bun.lockb'
      - '**/bun.lockb'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - 'composer.lock'
      - '**/composer.lock'
      - '**/Package.resolved'
      - '.github/**/pnpm-lock.yaml'
      - '.github/**/package-lock.json'
      - '.github/**/yarn.lock'
      - '.github/**/bun.lock'
      - '.github/**/bun.lockb'
      - '.github/**/Cargo.lock'
      - '.github/**/composer.lock'
