# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# Hosted cubic review settings. cubic bills per reviewed line, so this skips
# files whose review adds little. Code (including test code and test helpers),
# agent instructions, prompts, skills, specs, contracts and docs that define
# behaviour stay reviewed.
version: 1

reviews:
  ignore:
    files:
      # Prose documentation. The local review runs a docs-vs-code check (cubic
      # CLI) before the PR opens and on every fix push.
      - 'apps/**/README.md'
      - 'services/**/README.md'
      - 'ios/**/README.md'
      - '**/CHANGELOG.md'
      # Recorded test data (data file types only; helper code under these folders stays reviewed)
      - '**/fixtures/**/*.json'
      - '**/fixtures/**/*.jsonl'
      - '**/fixtures/**/*.ndjson'
      - '**/fixtures/**/*.yaml'
      - '**/fixtures/**/*.yml'
      - '**/fixtures/**/*.txt'
      - '**/fixtures/**/*.csv'
      - '**/fixtures/**/*.tsv'
      - '**/fixtures/**/*.xml'
      - '**/fixtures/**/*.eml'
      - '**/fixtures/**/*.sse'
      - '**/fixtures/**/*.log'
      - '**/fixtures/**/*.har'
      - '**/fixtures/**/*.svg'
      - '**/__fixtures__/**/*.json'
      - '**/__fixtures__/**/*.jsonl'
      - '**/__fixtures__/**/*.ndjson'
      - '**/__fixtures__/**/*.yaml'
      - '**/__fixtures__/**/*.yml'
      - '**/__fixtures__/**/*.txt'
      - '**/__fixtures__/**/*.csv'
      - '**/__fixtures__/**/*.tsv'
      - '**/__fixtures__/**/*.xml'
      - '**/__fixtures__/**/*.eml'
      - '**/__fixtures__/**/*.sse'
      - '**/__fixtures__/**/*.log'
      - '**/__fixtures__/**/*.har'
      - '**/__fixtures__/**/*.svg'
      - '**/testdata/**/*.json'
      - '**/testdata/**/*.jsonl'
      - '**/testdata/**/*.ndjson'
      - '**/testdata/**/*.yaml'
      - '**/testdata/**/*.yml'
      - '**/testdata/**/*.txt'
      - '**/testdata/**/*.csv'
      - '**/testdata/**/*.tsv'
      - '**/testdata/**/*.xml'
      - '**/testdata/**/*.eml'
      - '**/testdata/**/*.sse'
      - '**/testdata/**/*.log'
      - '**/testdata/**/*.har'
      - '**/testdata/**/*.svg'
      - '**/golden/**/*.json'
      - '**/golden/**/*.jsonl'
      - '**/golden/**/*.ndjson'
      - '**/golden/**/*.yaml'
      - '**/golden/**/*.yml'
      - '**/golden/**/*.txt'
      - '**/golden/**/*.csv'
      - '**/golden/**/*.tsv'
      - '**/golden/**/*.xml'
      - '**/golden/**/*.eml'
      - '**/golden/**/*.sse'
      - '**/golden/**/*.log'
      - '**/golden/**/*.har'
      - '**/golden/**/*.svg'
      # Test snapshots (snapshot folders holding reviewed contract JSON stay reviewed)
      - '**/*.snap'
      # Generated output
      - '**/dist/**'
      - '**/generated/**'
      - '**/*.generated.*'
      # Lockfiles. The local review checks new dependency advisories with osv-scanner.
      - 'pnpm-lock.yaml'
      - '**/pnpm-lock.yaml'
      - 'package-lock.json'
      - '**/package-lock.json'
      - 'yarn.lock'
      - '**/yarn.lock'
      - 'bun.lock'
      - '**/bun.lock'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '**/Package.resolved'
      - '.github/**/package-lock.json'
      - '.github/**/pnpm-lock.yaml'
