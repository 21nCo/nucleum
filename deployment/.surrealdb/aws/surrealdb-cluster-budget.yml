apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "1.28"

vpc:
  cidr: 10.0.0.0/16

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    resolveConflicts: overwrite
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  # Single small node for admin/control plane tasks
  - name: admin
    instanceType: t3.micro
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    labels:
      dedicated: admin
    availabilityZones: ["${AWS_REGION}a"]

  # PD (Placement Driver) nodes - using minimal instances
  - name: pd-combined
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    labels:
      dedicated: pd
    taints:
      - key: dedicated
        value: pd
        effect: NoSchedule
    availabilityZones: ["${AWS_REGION}a"]

  # TiKV storage nodes - using smaller instances with less memory
  - name: tikv-combined
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    labels:
      dedicated: tikv
    taints:
      - key: dedicated
        value: tikv
        effect: NoSchedule
    availabilityZones: ["${AWS_REGION}a"]

  # Default workload nodes
  - name: default
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    availabilityZones: ["${AWS_REGION}a"]
