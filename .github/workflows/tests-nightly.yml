name: Nightly Fuzz & Regression

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Execute property and fuzz suites
        run: npm run test
        env:
          VITEST_FUZZ: "1"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            coverage/**/coverage-final.json
            tests/coverage/**/coverage-final.json
          flags: vitest-nightly
          disable_search: true
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/e2e-playwright
      - name: Run regression suite
        run: npm run test:regression
        working-directory: apps/e2e-playwright
      - name: Persist coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: coverage
      - name: Persist Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright
          path: apps/e2e-playwright/artifacts
