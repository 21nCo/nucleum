name: Debug Sink Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - dev
    paths:
      - services/debug-sink/**
      - .github/workflows/debug-sink-deploy.yml
  pull_request:
    paths:
      - services/debug-sink/**
      - .github/workflows/debug-sink-deploy.yml
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nucleus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Debug sink typecheck
        run: npm --workspace @21n/debug-sink run typecheck

      - name: Build debug sink Worker
        run: npm --workspace @21n/debug-sink run deploy -- --dry-run --outdir dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: debug-sink-deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout Nucleus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Debug sink typecheck
        run: npm --workspace @21n/debug-sink run typecheck

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_DEV_API_TOKEN or CLOUDFLARE_DEV_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: npm --workspace @21n/debug-sink run d1:migrate:remote

      - name: Deploy debug sink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: npm --workspace @21n/debug-sink run deploy
