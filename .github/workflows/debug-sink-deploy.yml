name: Debug Sink Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - dev
    paths:
      - services/debug-sink/**
      - .github/workflows/debug-sink-deploy.yml
  pull_request:
    paths:
      - services/debug-sink/**
      - .github/workflows/debug-sink-deploy.yml
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nucleus
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Debug sink typecheck
        run: npm --workspace @21n/debug-sink run typecheck

      - name: Build debug sink Worker
        run: npm --workspace @21n/debug-sink run deploy -- --dry-run --outdir dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: debug-sink-deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout Nucleus
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Debug sink typecheck
        run: npm --workspace @21n/debug-sink run typecheck

      # The debug sink runs in the 21n-dev Cloudflare account.
      - name: Deploy debug sink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
        run: npm --workspace @21n/debug-sink run deploy
