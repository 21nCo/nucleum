name: Account Service Deploy

on:
  push:
    branches:
      - dev
    tags:
      - backend-pre-*
      - backend-live-*
  workflow_dispatch:
    inputs:
      environment:
        description: Account environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - pre
          - live
      regions:
        description: Comma-separated regions
        required: false
        default: insouth,useast,euwest

concurrency:
  group: account-service-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      regions: ${{ steps.detect.outputs.regions }}
    steps:
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "regions=${{ github.event.inputs.regions || 'insouth,useast,euwest' }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == backend-pre-* ]]; then
            echo "environment=pre" >> "$GITHUB_OUTPUT"
            echo "regions=insouth,useast,euwest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == backend-live-* ]]; then
            echo "environment=live" >> "$GITHUB_OUTPUT"
            echo "regions=insouth,useast,euwest" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "regions=insouth,useast,euwest" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: detect
    environment: ${{ needs.detect.outputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TODO_LIVE_INSOUTH_HYPERDRIVE_ID: ${{ vars.TODO_LIVE_INSOUTH_HYPERDRIVE_ID }}
      TODO_LIVE_USEAST_HYPERDRIVE_ID: ${{ vars.TODO_LIVE_USEAST_HYPERDRIVE_ID }}
      TODO_LIVE_EUWEST_HYPERDRIVE_ID: ${{ vars.TODO_LIVE_EUWEST_HYPERDRIVE_ID }}
    steps:
      - name: Checkout Nucleus
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Account service typecheck
        run: npm --workspace @21n/account-service run typecheck

      - name: Account service E2E memory
        run: npm --workspace @21n/account-service run test:e2e:apifn:memory

      - name: Deploy account service
        run: npm --workspace @21n/account-service run deploy:${{ needs.detect.outputs.environment }} -- --regions=${{ needs.detect.outputs.regions }}
