info:
  name: Session Cleared After Sign Out
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/auth/session"
runtime:
  scripts:
    - type: tests
      code: |
        test("cookie session is cleared after sign-out", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.session).to.equal(null);
        });
