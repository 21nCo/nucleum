info:
  name: Password Reset Start
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/auth/password/reset/start"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        env.set("newPassword", "ResetHorseBatteryStaple1!");
        req.body = JSON.stringify({
          email: env.get("email")
        });
    - type: tests
      code: |
        test("password reset challenge is sent", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.sent).to.equal(true);
          expect(Boolean(res.body.data.challengeId)).to.equal(true);
        });
        env.set("resetChallengeId", res.body.data.challengeId);
