info:
  name: Password Sign In
  type: http
  seq: 5
http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in/password"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          email: env.get("email"),
          password: env.get("password"),
          sessionMode: "hybrid"
        });
    - type: tests
      code: |
        test("password sign-in issues a session and token", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.data.session.id)).to.equal(true);
          expect(Boolean(res.body.data.token)).to.equal(true);
        });
        env.set("passwordSessionToken", res.body.data.token);
