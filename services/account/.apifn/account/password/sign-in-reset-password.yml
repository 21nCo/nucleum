info:
  name: Password Sign In With Reset Password
  type: http
  seq: 10
http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in/password"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          email: env.get("email"),
          password: env.get("newPassword"),
          sessionMode: "hybrid"
        });
    - type: tests
      code: |
        test("reset password can sign in", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.data.token)).to.equal(true);
        });
        env.set("resetSessionToken", res.body.data.token);
