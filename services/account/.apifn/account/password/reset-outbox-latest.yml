info:
  name: Password Reset Outbox Latest
  type: http
  seq: 8
http:
  method: GET
  url: "{{baseUrl}}/__test/outbox/latest"
  params:
    query:
      - name: identifier
        value: "{{email}}"
runtime:
  scripts:
    - type: tests
      code: |
        test("test outbox exposes the reset OTP", function() {
          expect(res.status).to.equal(200);
          expect(res.body.message.purpose).to.equal("reset-password");
          expect(Boolean(res.body.message.code)).to.equal(true);
        });
        env.set("resetOtp", res.body.message.code);
