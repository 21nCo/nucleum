info:
  name: Nucleus Bootstrap
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/auth/nucleus/bootstrap"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{sessionToken}}"
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          region: "insouth"
        });
    - type: tests
      code: |
        test("bootstrap marks the current AuthFn account as bootstrapped", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.session.metadata.nucleus.isBootstrapped).to.equal(true);
          expect(res.body.data.session.metadata.nucleus.regionId).to.equal("insouth");
          expect(res.body.data.session.regionId).to.equal("insouth");
        });
