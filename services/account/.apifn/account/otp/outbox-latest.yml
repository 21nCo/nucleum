info:
  name: Test Outbox Latest
  type: http
  seq: 7
http:
  method: GET
  url: "{{baseUrl}}/__test/outbox/latest"
  params:
    query:
      - name: identifier
        value: "{{email}}"
runtime:
  scripts:
    - type: tests
      code: |
        test("test outbox exposes the OTP", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.message.code)).to.equal(true);
        });
        env.set("otp", res.body.message.code);
