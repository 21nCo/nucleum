info:
  name: OTP Send Sign In
  type: http
  seq: 6
http:
  method: POST
  url: "{{baseUrl}}/auth/otp/send"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          email: env.get("email"),
          purpose: "sign-in"
        });
    - type: tests
      code: |
        test("OTP challenge is sent", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.sent).to.equal(true);
        });
        env.set("otpChallengeId", res.body.data.challengeId);
