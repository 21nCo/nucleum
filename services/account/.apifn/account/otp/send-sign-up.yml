info:
  name: OTP Send Sign Up
  type: http
  seq: 10
http:
  method: POST
  url: "{{baseUrl}}/auth/otp/send"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        env.set("otpSignupEmail", "otp-signup@example.com");
        req.body = JSON.stringify({
          email: env.get("otpSignupEmail"),
          purpose: "sign-up"
        });
    - type: tests
      code: |
        test("OTP sign-up challenge is sent", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.sent).to.equal(true);
        });
        env.set("otpSignupChallengeId", res.body.data.challengeId);
