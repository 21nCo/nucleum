info:
  name: Widget Token Create
  type: http
  seq: 13
http:
  method: POST
  url: "{{baseUrl}}/auth/widget-token"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{nativeToken}}"
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: tests
      code: |
        test("native bearer can issue scoped widget token", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.data.token)).to.equal(true);
        });
        env.set("widgetToken", res.body.data.token);
