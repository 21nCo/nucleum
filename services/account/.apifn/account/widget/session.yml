info:
  name: Widget Token Session
  type: http
  seq: 14
http:
  method: GET
  url: "{{baseUrl}}/auth/widget-token/session"
  headers:
    - name: authorization
      value: "Bearer {{widgetToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        test("widget token resolves scoped widget session", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.scopes.includes("widget:read")).to.equal(true);
        });
