info:
  name: OAuth Google Start
  type: http
  seq: 15
http:
  method: POST
  url: "{{baseUrl}}/auth/social/start"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          provider: "google",
          callbackMode: "json"
        });
    - type: tests
      code: |
        test("OAuth start returns provider redirect", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.data.redirectTo)).to.equal(true);
        });
        const redirect = new URL(res.body.data.redirectTo);
        env.set("oauthState", redirect.searchParams.get("state"));
        env.set("oauthCode", "google-apifn");
