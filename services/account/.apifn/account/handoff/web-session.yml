info:
  name: Web Handoff Cookie Session
  type: http
  seq: 15
http:
  method: GET
  url: "{{baseUrl}}/auth/session"
runtime:
  scripts:
    - type: tests
      code: |
        test("web handoff installed a cookie session", function() {
          expect(res.status).to.equal(200);
          expect(Boolean(res.body.data.session.id)).to.equal(true);
          expect(res.body.data.session.metadata.handoffTarget).to.equal("web");
        });
