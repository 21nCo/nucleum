info:
  name: EU Lookup US User
  type: http
  seq: 2
http:
  method: POST
  url: "{{euBaseUrl}}/auth/regions/lookup"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          identifier: env.get("mrEmail")
        });
    - type: tests
      code: |
        test("EU lookup redirects to US authority", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.regionId).to.equal("us");
          expect(res.body.data.continueLocally).to.equal(false);
          expect(res.body.data.redirectTo).to.equal(env.get("usBaseUrl"));
        });
