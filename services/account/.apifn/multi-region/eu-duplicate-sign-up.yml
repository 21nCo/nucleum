info:
  name: EU Duplicate Sign Up Conflict
  type: http
  seq: 3
http:
  method: POST
  url: "{{euBaseUrl}}/auth/sign-up/password"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
settings:
  expectedStatus: 409
runtime:
  scripts:
    - type: pre-request
      code: |
        req.body = JSON.stringify({
          email: env.get("mrEmail"),
          password: env.get("mrPassword"),
          sessionMode: "bearer"
        });
    - type: tests
      code: |
        test("EU duplicate sign-up is rejected with region metadata", function() {
          expect(res.status).to.equal(409);
          expect(res.body.ok).to.equal(false);
          expect(res.body.error.details.regionId).to.equal("us");
        });
